<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F6EFE1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>우리집 빙고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6EFE1; --paper:#FFFBF2; --ink:#2A2724; --mute:#8A8176; --line:#E5DAC6;
  --red:#E0473C; --blue:#2F6FB3; --amber:#F0A202; --green:#2E9E6A;
  font-family:'Jua','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
body{background-image:radial-gradient(rgba(120,90,50,.07) 1px,transparent 1px);background-size:7px 7px;
  overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;overflow:hidden}
#app{height:100vh;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button{font:inherit;border:0;cursor:pointer;color:inherit;background:none}
input{font:inherit;-webkit-user-select:text;user-select:text}
.scr{height:100%;display:flex;flex-direction:column;min-height:0}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{max-width:520px;margin:0 auto;width:100%;padding:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--ink);color:#fff;border-radius:14px;
  padding:13px 18px;font-size:18px;box-shadow:0 4px 0 rgba(0,0,0,.28);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.btn.red{background:var(--red)} .btn.blue{background:var(--blue)} .btn.green{background:var(--green)}
.btn.line{background:var(--paper);color:var(--ink);border:2px solid var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn.sm{padding:8px 12px;font-size:15px;border-radius:11px;box-shadow:0 3px 0 rgba(0,0,0,.22)}
.btn:disabled{opacity:.38;pointer-events:none}
.btn.full{width:100%}
.ghost{color:var(--mute);text-decoration:underline;padding:10px;font-size:15px}
.icon{width:38px;height:38px;border-radius:11px;background:var(--paper);border:2px solid var(--line);font-size:18px;display:grid;place-items:center;flex:none}

/* top bar */
.top{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.top .t{font-size:20px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{color:var(--mute);font-size:14px}
.net{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--mute);white-space:nowrap}
.net i{width:9px;height:9px;border-radius:50%;background:var(--green);display:inline-block}
.net.bad i{background:var(--amber);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}

/* cards */
.card{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:14px;margin:0 0 12px}
.card h3{margin:0 0 10px;font-size:18px;font-weight:normal;display:flex;align-items:center;gap:8px}
.card h3 small{color:var(--mute);font-size:14px}
.hint{color:var(--mute);font-size:14px;line-height:1.45;margin:6px 0 0}

/* ddakji graphic */
.dk{--a:var(--red);--b:var(--blue);--s:80px;display:inline-block;vertical-align:middle;width:var(--s);height:var(--s);position:relative;border-radius:7%;flex:none;
  background:
    linear-gradient(45deg,transparent calc(50% - 1.5px),rgba(0,0,0,.28) 50%,transparent calc(50% + 1.5px)),
    linear-gradient(-45deg,transparent calc(50% - 1.5px),rgba(0,0,0,.28) 50%,transparent calc(50% + 1.5px)),
    conic-gradient(from -45deg,var(--a) 0 25%,var(--b) 0 50%,var(--a) 0 75%,var(--b) 0);
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.14),inset 0 0 0 7px rgba(255,255,255,.18),0 calc(var(--s)*.06) 0 rgba(0,0,0,.22),0 calc(var(--s)*.12) calc(var(--s)*.2) rgba(0,0,0,.22)}
.dk .dkv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:58%;height:58%;border-radius:50%;
  background:var(--paper);display:grid;place-items:center;color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.2),inset 0 0 0 3px rgba(0,0,0,.08);
  font-size:calc(var(--s)*var(--fs,.3));line-height:1;text-align:center;word-break:break-all;padding:4%}

/* home */
.home{justify-content:center}
.logo{display:flex;flex-direction:column;align-items:center;gap:6px;margin:6px 0 18px}
.logo .dks{display:flex;gap:10px;margin-bottom:6px}
.logo .dks .dk:nth-child(1){transform:rotate(-12deg)} .logo .dks .dk:nth-child(2){transform:rotate(9deg) translateY(6px)}
.logo h1{margin:0;font-weight:normal;font-size:44px;letter-spacing:1px;line-height:1}
.logo h1 span{color:var(--red)}
.logo p{margin:0;color:var(--mute)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.field label{font-size:15px;color:var(--mute)}
.tin{width:100%;border:2px solid var(--line);background:#fff;border-radius:13px;padding:12px 14px;font-size:19px;color:var(--ink);outline:none}
.tin:focus{border-color:var(--ink)}
.joinrow{display:flex;gap:8px}
.joinrow .tin{text-align:center;letter-spacing:6px;font-size:22px}
.joinrow .tin{min-width:0;flex:1}
.joinrow .btn{white-space:nowrap;flex:none;padding-left:22px;padding-right:22px}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);margin:14px 0;font-size:14px}
.or:before,.or:after{content:"";flex:1;height:2px;background:var(--line)}
.resume{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.err{color:var(--red);font-size:15px;min-height:20px;margin-top:8px;text-align:center}

/* lobby */
.roomcode{display:flex;align-items:center;gap:14px}
.roomcode .big{font-size:52px;letter-spacing:6px;line-height:1}
.roomcode .lbl{font-size:14px;color:var(--mute)}
#qr{margin-top:10px;display:flex;gap:12px;align-items:center}
#qr svg{width:116px;height:116px;background:#fff;border-radius:10px;border:2px solid var(--line);flex:none}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plist li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:13px;background:#fff;border:2px solid var(--line);min-height:50px}
.plist li.empty{background:transparent;border-style:dashed;color:var(--mute)}
.plist .dot{width:22px;height:22px;flex:none}
.plist .dot.dk{--s:22px;box-shadow:inset 0 0 0 2px rgba(0,0,0,.12)}
.plist .nm{flex:1;font-size:18px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:12px;padding:3px 7px;border-radius:7px;background:var(--line);color:var(--ink);white-space:nowrap}
.tag.me{background:var(--ink);color:#fff} .tag.off{background:#FFE3C4;color:#9A5A00} .tag.ok{background:#DDF3E7;color:#1E7a4f}
.rm{width:30px;height:30px;border-radius:9px;background:#F3E9D8;color:var(--mute);font-size:15px;flex:none}
.aiadd{display:flex;gap:8px;margin-top:10px}
.aiadd .tin{font-size:16px;padding:10px 12px;min-width:0}
.aiadd .btn{white-space:nowrap;flex:none}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0}
.set + .set{border-top:2px dashed var(--line)}
.set .k{font-size:17px}
.set .k small{display:block;color:var(--mute);font-size:13px;margin-top:2px}
.step{display:flex;align-items:center;gap:8px}
.step b{min-width:64px;text-align:center;font-weight:normal;font-size:22px}
.step button{width:40px;height:40px;border-radius:12px;background:var(--ink);color:#fff;font-size:22px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.step button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.step button:disabled{opacity:.3}
.wait{text-align:center;color:var(--mute);padding:10px;font-size:16px}
.wait .dots:after{content:"";animation:dots 1.4s infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.bottom{padding:10px 14px 14px;display:flex;flex-direction:column;gap:6px;align-items:stretch;max-width:520px;margin:0 auto;width:100%}

/* fill */
.fillbox{--w:min(94vw,50vh,470px)}
.fillgrid{width:var(--w);height:var(--w);margin:4px auto 0;display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);gap:4px}
.fillgrid input{width:100%;height:100%;min-width:0;text-align:center;border:2px solid var(--line);border-radius:9px;background:#fff;
  font-size:calc(var(--w) / var(--n) * var(--f,.34));padding:0;color:var(--ink);outline:none;-webkit-appearance:none;appearance:none}
.fillgrid input:focus{border-color:var(--blue);background:#F0F6FF}
.fillgrid input.dup{border-color:var(--red);background:#FFE9E6}
.fillgrid input:disabled{background:#F3EDE2;color:var(--ink);opacity:1;-webkit-text-fill-color:var(--ink)}
.fmsg{text-align:center;font-size:15px;min-height:22px;margin:8px 0 4px;color:var(--mute)}
.fmsg.bad{color:var(--red)} .fmsg.good{color:var(--green)}
.tools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.tools button{background:var(--paper);border:2px solid var(--line);border-radius:11px;padding:7px 10px;font-size:14px}
.tools button.on{border-color:var(--ink)}
.fstat{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.fstat li{display:flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--line);border-radius:11px;padding:5px 9px;font-size:14px}
.fstat .dk{--s:14px;box-shadow:none}

/* play */
.play .top{padding:6px 8px 2px;gap:6px}
.play .net span{display:none}
.rule{font-size:14px;color:var(--mute);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.lastv{display:flex;align-items:center;gap:6px;margin-left:auto;font-size:14px;color:var(--mute);white-space:nowrap;min-width:0}
.lastv b{font-weight:normal;font-size:18px;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:9px;padding:1px 8px;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.boards{flex:1;min-height:0;display:grid;gap:6px;padding:4px 6px}
.boards.n1{grid-template-columns:1fr}
.boards.n2{grid-template-columns:1fr 1fr}
.boards.n3{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.boards.n3 .panel:first-child{grid-row:span 2}
.boards.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.panel{--pc:var(--red);position:relative;background:var(--paper);border:2px solid var(--line);border-radius:14px;display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;transition:box-shadow .25s,border-color .25s}
.panel.me{border-color:var(--pc)}
.panel.turn{border-color:var(--pc);box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 45%,transparent)}
.ph{display:flex;align-items:center;gap:5px;padding:4px 7px;font-size:14px;white-space:nowrap;background:color-mix(in srgb,var(--pc) 13%,var(--paper));min-width:0}
.ph .dk{--s:14px;box-shadow:none}
.ph .pn{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ph .ln{margin-left:auto;font-size:13px;color:var(--mute);flex:none}
.ph .ln b{font-weight:normal;color:var(--pc);font-size:15px}
.ph .tg{font-size:11px;padding:1px 5px;border-radius:6px;background:var(--ink);color:#fff;flex:none}
.ph .tg.off{background:#FFE3C4;color:#9A5A00}
.pb{flex:1;min-height:0;min-width:0;container-type:size;display:grid;place-items:center;padding:4px;position:relative}
.grid{width:min(100cqw,100cqh);height:min(100cqw,100cqh);display:grid;grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr);gap:2px}
.c{--f:.4;background:#fff;border:1px solid var(--line);border-radius:4px;display:grid;place-items:center;overflow:hidden;text-align:center;
  font-size:calc(min(100cqw,100cqh) / var(--n) * var(--f));line-height:1.05;word-break:break-all;color:var(--ink);transition:background .2s,color .2s;padding:1px}
.c.on{background:var(--pc);border-color:transparent;color:#fff}
.c.ln{background:color-mix(in srgb,var(--pc) 72%,#000);color:#fff}
.c.new{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.18)}100%{transform:none}}
.stamp{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.stamp span{border:4px solid var(--pc);color:var(--pc);background:rgba(255,251,242,.88);padding:3px 12px;border-radius:12px;transform:rotate(-12deg);
  font-size:clamp(18px,13cqmin,52px);box-shadow:0 3px 10px rgba(0,0,0,.15);animation:stampin .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes stampin{from{transform:rotate(-12deg) scale(2.4);opacity:0}}
.bar{padding:4px 8px 8px;display:flex;flex-direction:column;gap:6px}
.turnrow{display:flex;align-items:center;gap:8px;min-height:56px;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:6px 8px}
.turnrow .dk{--s:30px}
.turnrow .tt{flex:1;font-size:17px;min-width:0;line-height:1.2}
.turnrow .tt small{display:block;color:var(--mute);font-size:13px}
.drawbtn{display:flex;align-items:center;gap:8px;background:var(--red);color:#fff;border-radius:14px;padding:10px 16px;font-size:20px;box-shadow:0 5px 0 #9c2b22;animation:bob 1s ease-in-out infinite;flex:none}
.drawbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #9c2b22;animation:none}
.drawbtn .dk{--s:26px;--a:#fff;--b:#FFD3CC;box-shadow:none}
@keyframes bob{50%{transform:translateY(-3px)}}
.called{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-height:26px;align-items:center}
.called::-webkit-scrollbar{display:none}
.called .lab{font-size:12px;color:var(--mute);flex:none;margin-right:2px}
.chip{flex:none;font-size:14px;padding:2px 8px;border-radius:8px;background:var(--paper);border:2px solid var(--line);white-space:nowrap}
.chip.now{border-color:var(--ink);background:var(--ink);color:#fff}


/* 진행 방식 / 자동 진행 설정 */
.set.col{flex-direction:column;align-items:stretch}
.seg{display:flex;background:#EFE6D5;border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px 6px;border-radius:10px;font-size:16px;color:var(--mute)}
.seg button.on{background:var(--ink);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.seg button:disabled{opacity:1}
.seg button:disabled:not(.on){opacity:.55}
.tog{width:58px;height:32px;border-radius:999px;background:#D8CDB9;position:relative;flex:none;transition:background .2s}
.tog i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 3px rgba(0,0,0,.25);transition:left .2s}
.tog.on{background:var(--green)} .tog.on i{left:29px}
.tog:disabled{opacity:.75}
#ivwrap{padding-top:4px}
/* 게임 스타일 막대 */
.gpanel{display:flex;align-items:center;gap:10px;background:linear-gradient(160deg,#4144B5,#2A2A86);border-radius:16px;padding:12px 14px 12px 10px;box-shadow:inset 0 2px 0 rgba(255,255,255,.12),0 3px 0 rgba(0,0,0,.18)}
.gbar{--pc:#E9473B;flex:1;display:flex;align-items:center;position:relative;touch-action:none;outline:none;cursor:pointer;min-width:0}
.gbar.ro{cursor:default}
.gbar:focus-visible .gtrack{box-shadow:0 0 0 3px #fff}
.gicon{width:46px;height:46px;border-radius:50%;flex:none;z-index:2;display:grid;place-items:center;font-size:23px;
  background:radial-gradient(circle at 35% 30%,#FFF2C2,#F6BE45 55%,#D9951E);border:3px solid #B97A12;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.gtrack{position:relative;flex:1;height:26px;margin-left:-12px;border-radius:999px;background:#7E521A;border:4px solid #F2B33D;
  box-shadow:inset 0 4px 0 rgba(0,0,0,.28),0 3px 0 rgba(0,0,0,.25)}
.gfill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;--c2:color-mix(in srgb,var(--pc) 55%,#fff);
  background:linear-gradient(rgba(255,255,255,.5),rgba(255,255,255,0) 55%),repeating-linear-gradient(-55deg,var(--pc) 0 10px,var(--c2) 10px 19px)}
.gknob{position:absolute;top:50%;width:16px;height:40px;transform:translate(-50%,-50%);border-radius:9px;
  background:linear-gradient(90deg,#FFD978,#E9A72B);border:3px solid #B97A12;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.gval{min-width:52px;text-align:center;font-size:24px;color:#FFD566;text-shadow:0 2px 0 #7E521A}
.tbar{display:flex;align-items:center;gap:8px;background:linear-gradient(160deg,#4144B5,#2A2A86);border-radius:14px;padding:5px 10px 5px 6px}
.tbar .gicon{width:32px;height:32px;font-size:16px;border-width:2px}
.tbar .gtrack{height:18px;border-width:3px;margin-left:-9px}
.tbar .gknob{width:11px;height:28px;border-width:2px}
.tbar .gval.sm{font-size:18px;min-width:40px}
.tbar.hurry .gicon{animation:hurry .5s ease-in-out infinite}
@keyframes hurry{50%{transform:rotate(18deg) scale(1.08)}}
/* 직접 고르기 */
.panel.picking{border-color:var(--pc);box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 45%,transparent)}
.panel.picking .c.pk{cursor:pointer;outline:2px dashed color-mix(in srgb,var(--pc) 70%,#fff);outline-offset:-3px;animation:pkp 1.3s ease-in-out infinite}
@keyframes pkp{50%{background:color-mix(in srgb,var(--pc) 14%,#fff)}}
.panel.picking .c.sel{animation:none;background:color-mix(in srgb,var(--pc) 30%,#fff);outline:3px solid var(--ink);outline-offset:-3px;transform:scale(1.08);position:relative;z-index:1}
/* 내 판만 보기: 가려진 판 */
.c.hid{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--pc) 20%,#fff) 0 6px,color-mix(in srgb,var(--pc) 9%,#fff) 6px 12px);border-color:color-mix(in srgb,var(--pc) 28%,#fff)}
.lockov{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.lockov span{background:rgba(255,251,242,.94);border:2px solid var(--pc);border-radius:12px;padding:4px 10px;font-size:clamp(13px,8cqmin,22px);white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.12)}
/* ddakji overlay */
.dkwrap{position:fixed;inset:0;display:none;place-items:center;pointer-events:none;z-index:50}
.dkwrap.show,.dkwrap.out{display:grid}
.dkwrap .stage{position:relative;display:grid;place-items:center}
.dkwrap .dk{--s:min(56vw,38vh,300px);animation:slam .42s cubic-bezier(.25,.6,.35,1.25) both}
.dkwrap .who{position:absolute;top:calc(100% + 18px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:18px;background:var(--ink);color:#fff;padding:4px 12px;border-radius:10px;animation:fadein .3s .35s both}
.dkwrap .ring{position:absolute;width:min(56vw,38vh,300px);height:min(56vw,38vh,300px);border-radius:50%;border:6px solid rgba(42,39,36,.35);opacity:0;animation:ring .5s .3s ease-out both}
.dkwrap .dust{position:absolute;width:12px;height:12px;border-radius:50%;background:rgba(140,110,70,.5);opacity:0;animation:dust .55s .3s ease-out both}
.dkwrap.out .stage{animation:away .4s ease-in forwards}
@keyframes slam{0%{transform:translateY(-70vh) rotate(-260deg) scale(2);opacity:0}15%{opacity:1}72%{transform:translateY(0) rotate(6deg) scale(.9)}86%{transform:rotate(-3deg) scale(1.05)}100%{transform:none}}
@keyframes ring{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.7);opacity:0}}
@keyframes dust{0%{transform:translate(0,0) scale(1);opacity:.9}100%{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
@keyframes away{to{transform:translateY(-38vh) scale(.18);opacity:0}}
@keyframes fadein{from{opacity:0;transform:translate(-50%,8px)}}
body.shake #app{animation:shake .28s linear}
@keyframes shake{20%{transform:translate(-5px,3px)}40%{transform:translate(5px,-3px)}60%{transform:translate(-3px,2px)}80%{transform:translate(3px,-1px)}}

/* modal / toast */
.modal{position:fixed;inset:0;z-index:60;background:rgba(42,39,36,.45);display:grid;place-items:center;padding:16px;animation:fade .2s}

<script>
'use strict';
/* =========================================================
   우리집 빙고 — 가족용 실시간 빙고
   구조: 방을 만든 기기(호스트)가 게임 상태를 관리하고,
         참가자들은 방 코드로 같은 중계 채널에 들어옵니다.
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const COLORS = ['#E0473C', '#2F6FB3', '#F0A202', '#2E9E6A'];
const PAIR = i => COLORS[(i + 1) % 4];
const PREFIX = 'kbingo-v1-';
const MAX_PLAYERS = 4, MIN_N = 3, MAX_N = 7, CELL_MAX = 6, NAME_MAX = 8;
const Q = new URLSearchParams(location.search);
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};
const rid = (n = 8) => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => 'abcdefghijkmnpqrstuvwxyz23456789'[b % 32]).join('');
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const cleanName = s => String(s || '').replace(/[\u0000-\u001f]/g, '').trim().slice(0, NAME_MAX);
const setHTML = (el, html) => { if (el && el._h !== html) { el._h = html; el.innerHTML = html; } };
const MEDAL = r => r === 1 ? '🥇' : r === 2 ? '🥈' : r === 3 ? '🥉' : '🏅';
const dkHTML = (i, extra = '', inner = '') => `<span class="dk" style="--a:${COLORS[i % 4]};--b:${PAIR(i % 4)};${extra}">${inner}</span>`;
const isWeb = /^https?:$/.test(location.protocol);

/* ---------- 외부 스크립트 로더 ---------- */
function loadScript(urls) {
  return new Promise((res, rej) => {
    const tryAt = i => {
      if (i >= urls.length) return rej(new Error('load failed'));
      const sc = document.createElement('script');
      sc.src = urls[i]; sc.async = true;
      sc.onload = () => res(); sc.onerror = () => { sc.remove(); tryAt(i + 1); };
      document.head.appendChild(sc);
    };
    tryAt(0);
  });
}
let qrLib = null;
function needQR() {
  if (window.qrcode) return Promise.resolve();
  if (!qrLib) qrLib = loadScript([
    'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js',
    'https://unpkg.com/qrcode-generator@1.4.4/qrcode.js'
  ]).catch(e => { qrLib = null; throw e; });
  return qrLib;
}
/* ---------- 실시간 연결 ----------
   공개 MQTT 중계 서버(웹소켓) 여러 곳에 동시에 접속해서 같은 메시지를 모두에 보냅니다.
   한두 곳이 멈춰도 나머지로 계속 연결됩니다. (받은 메시지는 중복 제거) */
const BROKERS = Q.get('broker') ? Q.get('broker').split(',') : [
  'wss://broker.emqx.io:8084/mqtt',
  'wss://broker.hivemq.com:8884/mqtt',
  'wss://test.mosquitto.org:8081/mqtt'
];
const TOPIC = 'kbingo/v2/';
const inFrame = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
const enc = new TextEncoder(), dec = new TextDecoder();
const sleep = ms => new Promise(r => setTimeout(r, ms));
function cat(...parts) { let n = 0; parts.forEach(p => n += p.length); const u = new Uint8Array(n); let o = 0; parts.forEach(p => { u.set(p, o); o += p.length; }); return u; }
const u16 = n => Uint8Array.of((n >> 8) & 255, n & 255);
const mqs = s => { const b = enc.encode(s); return cat(u16(b.length), b); };
function pkt(head, body) {
  const len = []; let n = body.length;
  do { let d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; len.push(d); } while (n > 0);
  return cat(Uint8Array.of(head, ...len), body);
}
class Mq { // MQTT 3.1.1 (QoS 0) 최소 구현
  constructor(url, bus) { this.url = url; this.bus = bus; this.ws = null; this.ok = false; this.buf = new Uint8Array(0); this.pid = 1; this.wait = 1000; this.dead = false; this.last = 0; this.open(); }
  open() {
    if (this.dead) return;
    let ws;
    try { ws = new WebSocket(this.url, ['mqtt']); } catch (e) { this.retry(); return; }
    this.ws = ws; ws.binaryType = 'arraybuffer'; this.buf = new Uint8Array(0);
    const to = setTimeout(() => { if (this.ws === ws && !this.ok) try { ws.close(); } catch (e) {} }, 9000);
    ws.onopen = () => { this.send(pkt(0x10, cat(mqs('MQTT'), Uint8Array.of(4, 2, 0, 45), mqs('kb' + rid(16))))); };
    ws.onmessage = ev => { this.last = Date.now(); if (ev.data instanceof ArrayBuffer) this.feed(new Uint8Array(ev.data)); };
    ws.onclose = ws.onerror = () => {
      clearTimeout(to);
      if (this.ws !== ws) return;
      this.ws = null; clearInterval(this.ping);
      const was = this.ok; this.ok = false;
      if (was) this.bus.changed();
      this.retry();
    };
  }
  retry() { if (this.dead) return; clearTimeout(this.rt); this.rt = setTimeout(() => this.open(), this.wait); this.wait = Math.min(this.wait * 2, 15000); }
  kick() { if (!this.dead && !this.ws) { clearTimeout(this.rt); this.wait = 1000; this.open(); } } // 화면 복귀 시 바로 재접속
  feed(chunk) {
    this.buf = this.buf.length ? cat(this.buf, chunk) : chunk;
    for (;;) {
      const b = this.buf; if (b.length < 2) return;
      let mul = 1, len = 0, i = 1, d;
      do { if (i >= b.length) return; d = b[i++]; len += (d & 127) * mul; mul *= 128; } while ((d & 128) && i < 5);
      if (b.length < i + len) return;
      this.packet(b[0], b.subarray(i, i + len));
      this.buf = b.subarray(i + len);
    }
  }
  packet(h, body) {
    const type = h >> 4;
    if (type === 2) { // CONNACK
      if (body[1] !== 0) { try { this.ws.close(); } catch (e) {} return; }
      this.ok = true; this.wait = 1000;
      for (const t of this.bus.topics) this.subscribe(t);
      clearInterval(this.ping);
      this.ping = setInterval(() => {
        if (!this.ok) return;
        if (Date.now() - this.last > 50000) { try { this.ws.close(); } catch (e) {} return; }
        this.send(Uint8Array.of(0xC0, 0));
      }, 20000);
      this.bus.changed();
    } else if (type === 3) { // PUBLISH
      const qos = (h >> 1) & 3, tl = (body[0] << 8) | body[1];
      const topic = dec.decode(body.subarray(2, 2 + tl));
      const o = 2 + tl + (qos ? 2 : 0);
      this.bus.incoming(topic, dec.decode(body.subarray(o)));

  }
  send(u) { try { if (this.ws && this.ws.readyState === 1) { this.ws.send(u); return true; } } catch (e) {} return false; }
  nextId() { this.pid = (this.pid % 65535) + 1; return this.pid; }
  subscribe(t) { if (this.ok) this.send(pkt(0x82, cat(u16(this.nextId()), mqs(t), Uint8Array.of(0)))); }
  unsubscribe(t) { if (this.ok) this.send(pkt(0xA2, cat(u16(this.nextId()), mqs(t)))); }
  publish(t, s) { return this.ok && this.send(pkt(0x30, cat(mqs(t), enc.encode(s)))); }
  close() {
    this.dead = true; clearTimeout(this.rt); clearInterval(this.ping);
    const ws = this.ws; this.ws = null; this.ok = false;
    if (ws) { try { if (ws.readyState === 1) ws.send(Uint8Array.of(0xE0, 0)); ws.close(); } catch (e) {} }
  }
}
class Bus {
  constructor(urls) { this.topics = new Set(); this.handlers = new Map(); this.seen = new Set(); this.seenQ = []; this.fns = []; this.conns = urls.map(u => new Mq(u, this)); }
  get ok() { return this.conns.some(c => c.ok); }
  changed() { const ok = this.ok; this.fns.forEach(f => { try { f(ok); } catch (e) { console.error(e); } }); }
  onChange(f) { this.fns.push(f); }
  sub(t, fn) { this.topics.add(t); this.handlers.set(t, fn); this.conns.forEach(c => c.subscribe(t)); }
  unsub(t) { this.topics.delete(t); this.handlers.delete(t); this.conns.forEach(c => c.unsubscribe(t)); }
  mark(id) { this.seen.add(id); this.seenQ.push(id); if (this.seenQ.length > 800) this.seen.delete(this.seenQ.shift()); }
  pub(t, obj) {
    obj.mid = rid(10); this.mark(obj.mid);
    const s = JSON.stringify(obj); let n = 0;
    this.conns.forEach(c => { if (c.publish(t, s)) n++; });
    return n > 0;
  }
  incoming(t, s) {
    let m; try { m = JSON.parse(s); } catch (e) { return; }
    if (!m || typeof m !== 'object' || typeof m.mid !== 'string') return;
    if (this.seen.has(m.mid)) return; this.mark(m.mid);
    const h = this.handlers.get(t); if (h) h(m);
  }
  kick() { this.conns.forEach(c => c.kick()); }
  close() { this.fns = []; this.handlers.clear(); this.conns.forEach(c => c.close()); }
}
function netTrouble() {
  return (!isWeb || inFrame)
    ? '이 화면(미리보기)에서는 인터넷 연결이 막혀 있을 수 있어요. 파일을 웹(GitHub Pages 등)에 올린 주소로, 휴대폰 브라우저에서 열어 주세요.'
    : '연결 서버에 아직 닿지 못했어요. 와이파이나 데이터 연결을 확인해 주세요. 계속 다시 시도하는 중이에요…';
}

/* ---------- 소리 (딱지치기 효과음은 Web Audio로 합성) ---------- */
const Snd = {
  ctx: null, out: null, nb: null, on: LS.get('kb-sound', true),
  unlock() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        this.ctx = new AC();
        this.out = this.ctx.createDynamicsCompressor(); this.out.connect(this.ctx.destination);
        const len = Math.floor(this.ctx.sampleRate * 0.4);
        this.nb = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        const d = this.nb.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        const o = this.ctx.createOscillator(), g = this.ctx.createGain(); g.gain.value = 0.0001;
        o.connect(g).connect(this.out); o.start(); o.stop(this.ctx.currentTime + 0.02);
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
    } catch (e) {}
  },
  ok() { return this.on && this.ctx && this.ctx.state === 'running'; },
  burst(t, f, q, peak, dec, type = 'bandpass') {
    const c = this.ctx, s = c.createBufferSource(); s.buffer = this.nb;
    const fl = c.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t + dec);
    s.connect(fl).connect(g).connect(this.out); s.start(t); s.stop(t + dec + 0.05);
  },
  thump(t, f0, f1, peak, dec) {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dec * 0.8);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + dec);
    o.connect(g).connect(this.out); o.start(t); o.stop(t + dec + 0.05);
  },
  slap() { // "탁!" — 두꺼운 종이가 바닥을 때리는 소리
    if (!this.ok()) return;
    const t = this.ctx.currentTime + 0.01;
    this.burst(t, 1400, 0.8, 1.0, 0.11);
    this.burst(t, 4200, 1.2, 0.55, 0.035, 'highpass');
    this.thump(t, 150, 48, 0.95, 0.18);
    this.burst(t + 0.055, 1100, 1.0, 0.18, 0.06); // 종이가 들썩이며 한 번 더
  },
  tone(t, f, dur, vol = 0.18, type = 'triangle') {
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.out); o.start(t); o.stop(t + dur + 0.05);
  },
  ding() { if (!this.ok()) return; const t = this.ctx.currentTime + 0.01; this.tone(t, 1320, 0.25, 0.12, 'sine'); this.tone(t + 0.07, 1760, 0.3, 0.1, 'sine'); },
  myturn() { if (!this.ok()) return; const t = this.ctx.currentTime + 0.01; this.tone(t, 660, 0.15, 0.12); this.tone(t + 0.12, 880, 0.2, 0.12); },
  line() { if (!this.ok()) return; const t = this.ctx.currentTime + 0.01; [784, 988, 1175].forEach((f, i) => this.tone(t + i * 0.08, f, 0.22, 0.14)); },
  fanfare() { if (!this.ok()) return; const t = this.ctx.currentTime + 0.02; [523, 659, 784, 1047, 784, 1047].forEach((f, i) => this.tone(t + i * 0.11, f, i === 5 ? 0.6 : 0.2, 0.16, 'square')); }

['pointerdown', 'touchend', 'keydown'].forEach(ev => document.addEventListener(ev, () => Snd.unlock(), { passive: true }));
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

/* ---------- 화면 꺼짐 방지 ---------- */

/* ---------- 나 ---------- */
const me = {

}

  if (Snd.on) { Snd.unlock(); setTimeout(() => Snd.slap(), 30); }

/* =========================================================
   게임 규칙 (호스트가 실행)
   ========================================================= */
const IV_MIN = 3, IV_MAX = 20; // 자동 진행 간격(초)
const LINES = {};
function allLines(N) {
  if (LINES[N]) return LINES[N];
  const L = [];
  for (let r = 0; r < N; r++) L.push(Array.from({ length: N }, (_, c) => r * N + c));
  for (let c = 0; c < N; c++) L.push(Array.from({ length: N }, (_, r) => r * N + c));
  L.push(Array.from({ length: N }, (_, i) => i * N + i));
  L.push(Array.from({ length: N }, (_, i) => i * N + (N - 1 - i)));
  return (LINES[N] = L);
}
function lineInfo(board, calledSet, N) {
  const res = { count: 0, mask: new Set() };
  if (!board || board.length !== N * N) return res;
  const on = i => calledSet.has(norm(board[i]));
  for (const ln of allLines(N)) if (ln.every(on)) { res.count++; ln.forEach(i => res.mask.add(i)); }
  return res;
}
// 직접 고르기 자동 선택(AI·시간 초과): 줄 완성에 가까운 칸을 우선
function smartPick(board, calledSet, N) {
  if (!board || board.length !== N * N) return null;
  const on = i => calledSet.has(norm(board[i]));
  let best = null, bestSc = -1;
  board.forEach((v, i) => {
    if (on(i)) return;
    let sc = Math.random() * 0.8;
    for (const ln of allLines(N)) if (ln.includes(i)) { const m = ln.filter(on).length; sc += (m + 1) * (m + 1); }
    if (sc > bestSc) { bestSc = sc; best = v; }
  });
  return best;
}
function validBoard(cells, N) {
  if (!Array.isArray(cells) || cells.length !== N * N) return null;
  const out = cells.map(v => String(v == null ? '' : v).replace(/[\u0000-\u001f]/g, '').trim().slice(0, CELL_MAX));
  const keys = out.map(norm);
  if (keys.some(k => !k)) return null;
  if (new Set(keys).size !== keys.length) return null;
  return out;
}

const H = { bus: null, hid: null, last: new Map(), S: null, autoTimer: null, autoKey: '', lastDrawAt: 0, hb: null, resuming: false, everOpen: false, claiming: false };

  return { v: 1, code, phase: 'lobby', N: 5, L: 5, mode: 'draw', view: 'all', auto: false, iv: 6, deadline: 0, game: 1, players: [], called: [], turn: 0, draw: { seq: 0, value: null, by: null }, ts: Date.now() };
}
function freeColor(s) { const used = new Set(s.players.map(p => p.color)); for (let i = 0; i < 4; i++) if (!used.has(i)) return i; return 0; }
function mkPlayer(s, id, name, ai) { return { id, name, ai: !!ai, color: freeColor(s), board: null, ready: false, online: true, rank: null, at: null, lines: 0 }; }

function hostBroadcast() {
  const s = H.S; s.ts = Date.now(); s.rev = (+s.rev || 0) + 1;
  LS.set('kb-host', s);
  if (H.everOpen && H.bus) H.bus.pub(TOPIC + s.code + '/s', { t: 'state', s, hid: H.hid });
  hostAuto();
  onState(JSON.parse(JSON.stringify(s)));
}
function hostSendTo(pid, msg) { if (!H.bus) return; if (pid) msg.to = pid; msg.hid = H.hid; H.bus.pub(TOPIC + H.S.code + '/s', msg); }

function hostAuto() { // AI 차례, 연결이 끊긴 사람 차례 자동 진행
  const s = H.S;
  if (s.phase !== 'play') { clearTimeout(H.autoTimer); H.autoKey = ''; return; }
  const cur = s.players[s.turn]; if (!cur) return;
  const who = cur.ai ? 'ai' : (!cur.online && cur.id !== 'host') ? 'off' : 'on';
  const key = [s.game, s.draw.seq, s.turn, who, s.auto ? s.deadline : 0].join(':');
  if (key === H.autoKey) return;
  H.autoKey = key; clearTimeout(H.autoTimer);
  let wait = who === 'ai' ? 2600 + rnd(800) : who === 'off' ? 8000 : Infinity;
  if (s.auto && s.deadline) wait = Math.min(wait, Math.max(300, s.deadline - Date.now()));
  if (wait !== Infinity) H.autoTimer = setTimeout(() => hostDraw(cur.id, true), wait);
}

function hostAction(pid, msg) {
  const s = H.S; const p = s.players.find(x => x.id === pid);
  if (!p || !msg || typeof msg !== 'object') return;
  switch (msg.t) {
    case 'board': {
      if (s.phase !== 'fill') return;
      const b = validBoard(msg.cells, s.N); if (!b) return;
      p.board = b; p.ready = true; hostMaybeStart(); hostBroadcast(); break;
    }
    case 'unready':
      if (s.phase !== 'fill') return; p.ready = false; hostBroadcast(); break;
    case 'draw':
      if (s.mode !== 'pick') hostDraw(pid, false); break;
    case 'pick':
      if (s.mode === 'pick' && typeof msg.v === 'string') hostDraw(pid, false, msg.v); break;
    case 'leave': {
      if (pid === 'host') return;
      if (s.phase === 'lobby' || s.phase === 'fill') { s.players = s.players.filter(x => x.id !== pid); hostMaybeStart(); }
      else p.online = false;
      H.last.delete(pid);
      hostBroadcast(); break;
    }
  }
}
function hostMaybeStart() {
  const s = H.S;
  if (s.phase !== 'fill' || s.players.length < 2) return;
  const humans = s.players.filter(p => !p.ai);
  if (!humans.every(p => p.ready && p.board)) return;
  // AI 게임판: 다른 플레이어들의 칸에서 무작위로 골라 무작위 위치에 배치
  const pool = new Map();
  humans.forEach(p => p.board.forEach(v => { const k = norm(v); if (!pool.has(k)) pool.set(k, v); }));
  const vals = [...pool.values()];
  s.players.forEach(p => { if (p.ai) { p.board = shuffle(vals).slice(0, s.N * s.N); p.ready = true; } });
  s.players.forEach(p => { p.rank = null; p.at = null; p.lines = 0; });
  s.phase = 'play'; s.called = []; s.turn = rnd(s.players.length);
  s.draw = { seq: s.draw.seq, value: null, by: null };
  s.deadline = s.auto ? Date.now() + s.iv * 1000 + 1500 : 0;
  H.lastDrawAt = 0;
}
// 한 번 부르기: 뽑기 모드는 모든 판에서 무작위, 직접 고르기 모드는 차례인 사람 판에서 고른 값(자동이면 대신 골라 줌)
function hostDraw(pid, force, pickV) {
  const s = H.S;
  if (s.phase !== 'play') return;
  const cur = s.players[s.turn];
  if (!cur || (!force && cur.id !== pid)) return;
  if (Date.now() - H.lastDrawAt < 1400) { if (force) setTimeout(() => { H.autoKey = ''; hostAuto(); }, 1500); return; }
  const calledSet = new Set(s.called.map(norm));
  let label = null;
  if (s.mode === 'pick') {
    if (!force) {
      const k = norm(pickV);
      label = (cur.board || []).find(v => norm(v) === k);
      if (label == null || calledSet.has(k)) return;
    } else label = smartPick(cur.board, calledSet, s.N);
  }
  if (label == null) {
    const avail = new Map();
    s.players.forEach(p => (p.board || []).forEach(v => { const k = norm(v); if (!calledSet.has(k) && !avail.has(k)) avail.set(k, v); }));
    if (!avail.size) return;
    const keys = [...avail.keys()]; label = avail.get(keys[rnd(keys.length)]);
  }
  s.called.push(label); calledSet.add(norm(label));
  s.draw = { seq: s.draw.seq + 1, value: label, by: cur.id, auto: !!force && !cur.ai };
  H.lastDrawAt = Date.now();
  s.deadline = s.auto ? Date.now() + s.iv * 1000 : 0;
  const newly = [];
  s.players.forEach(p => { p.lines = lineInfo(p.board, calledSet, s.N).count; if (p.rank == null && p.lines >= s.L) newly.push(p); });
  const done = s.players.filter(p => p.rank != null).length;
  newly.forEach(p => { p.rank = done + 1; p.at = s.called.length; });
  const active = s.players.filter(p => p.rank == null);
  if (active.length <= 1) {
    const r = s.players.filter(p => p.rank != null).length + 1;
    active.forEach(p => { p.rank = r; });
    s.phase = 'end';
  } else {
    for (let i = 1; i <= s.players.length; i++) { const j = (s.turn + i) % s.players.length; if (s.players[j].rank == null) { s.turn = j; break; } }
  }
  hostBroadcast();
}
const hostCmd = {
  setN(d) { const s = H.S; if (s.phase !== 'lobby') return; s.N = clamp(s.N + d, MIN_N, MAX_N); s.L = clamp(s.L, 1, 2 * s.N + 2); hostBroadcast(); },
  setL(d) { const s = H.S; if (s.phase !== 'lobby') return; s.L = clamp(s.L + d, 1, 2 * s.N + 2); hostBroadcast(); },
  setMode(m) { const s = H.S; if (s.phase !== 'lobby') return; s.mode = m === 'pick' ? 'pick' : 'draw'; hostBroadcast(); },
  setView(v) { const s = H.S; if (s.phase !== 'lobby') return; s.view = v === 'mine' ? 'mine' : 'all'; hostBroadcast(); },
  setAuto(on) { const s = H.S; s.auto = !!on; s.deadline = s.auto && s.phase === 'play' ? Date.now() + s.iv * 1000 : 0; hostBroadcast(); },
  setIv(v) {
    const s = H.S; const nv = clamp(Math.round(+v || 0), IV_MIN, IV_MAX); if (nv === s.iv) return;
    s.iv = nv; if (s.auto && s.phase === 'play') s.deadline = Date.now() + s.iv * 1000; hostBroadcast();
  },
  addAI(name) {
    const s = H.S; if (s.phase !== 'lobby' || s.players.length >= MAX_PLAYERS) return;
    const n = cleanName(name) || ('로봇' + (s.players.filter(p => p.ai).length + 1));
    s.players.push(mkPlayer(s, 'ai-' + rid(6), n, true)); hostBroadcast();
  },
  remove(id) {
    const s = H.S; if (id === 'host' || !(s.phase === 'lobby' || s.phase === 'fill')) return;
    s.players = s.players.filter(p => p.id !== id);
    hostSendTo(id, { t: 'kicked' }); H.last.delete(id);
    hostMaybeStart(); hostBroadcast();
  },
  startFill() {
    const s = H.S; if (s.phase !== 'lobby' || s.players.length < 2) return;
    s.phase = 'fill'; s.game++; s.called = [];
    s.players.forEach(p => { p.board = null; p.ready = false; p.rank = null; p.at = null; p.lines = 0; });
    hostBroadcast();
  },
  toLobby() {
    const s = H.S; s.phase = 'lobby'; s.game++; s.called = [];
    s.players.forEach(p => { p.board = null; p.ready = false; p.rank = null; p.at = null; p.lines = 0; });
    hostBroadcast();
  },
  forceDraw() { const s = H.S; if (s.phase !== 'play') return; const cur = s.players[s.turn]; if (cur) hostDraw(cur.id, true); },
  async close() {
    if (!(await ask('방을 닫을까요? 모든 사람의 게임이 끝나요.', '방 닫기'))) return;
    hostSendTo(null, { t: 'closed' });
    LS.del('kb-host');
    setTimeout(() => { if (H.bus) H.bus.close(); H.bus = null; clearInterval(H.hb); clearTimeout(H.autoTimer); role = null; S = null; renderHome(); }, 500);
  }
};

async function hostOpen(resume) {
  role = 'host'; renderConnecting(resume ? '방을 다시 여는 중…' : '방을 만드는 중…', () => !H.everOpen);
  const saved = resume ? LS.get('kb-host', null) : null;
  if (saved && saved.code) {
    H.S = saved; H.resuming = true;
    H.S.players.forEach(p => { if (!p.ai && p.id !== 'host') p.online = false; });
    const hp = H.S.players.find(p => p.id === 'host'); if (hp) hp.name = me.name || hp.name;
    if (H.S.mode !== 'pick') H.S.mode = 'draw';
    if (H.S.view !== 'mine') H.S.view = 'all';
    H.S.iv = clamp(+H.S.iv || 6, IV_MIN, IV_MAX); H.S.auto = !!H.S.auto;
    H.S.deadline = H.S.auto && H.S.phase === 'play' ? Date.now() + H.S.iv * 1000 : 0;
  } else {
    H.S = newState(String(1000 + rnd(9000))); H.resuming = false;
    H.S.players.push(mkPlayer(H.S, 'host', me.name, false));
  }
  H.hid = rid(8); H.last = new Map(); H.everOpen = false; H.claiming = false;
  if (H.bus) H.bus.close();
  H.bus = new Bus(BROKERS);
  H.bus.onChange(ok => { if (role !== 'host') return; setNet(ok ? 'ok' : 'reconnecting'); if (ok && !H.everOpen) hostClaim(); });
  clearInterval(H.hb);
  H.hb = setInterval(hostTick, 3000);
}
async function hostClaim() { // 같은 방 코드를 쓰는 다른 방이 없는지 잠깐 확인한 뒤 방을 엽니다
  if (H.claiming || H.everOpen) return;
  H.claiming = true;
  const bus = H.bus;
  for (let tries = 0; tries < 5 && !H.resuming; tries++) {
    const t = TOPIC + H.S.code + '/s'; let taken = false;
    bus.sub(t, m => { if (m.t === 'state' && m.hid && m.hid !== H.hid) taken = true; });
    await sleep(3300);
    bus.unsub(t);
    if (H.bus !== bus || role !== 'host') return;
    if (!taken) break;
    H.S.code = String(1000 + rnd(9000));
  }
  bus.sub(TOPIC + H.S.code + '/c', hostOnMsg);
  H.everOpen = true; H.claiming = false;
  setNet(bus.ok ? 'ok' : 'reconnecting');
  hostBroadcast();
}
function hostOnMsg(m) {
  const s = H.S; const pid = String(m.pid || '');
  if (!/^p[a-z0-9]{4,40}$/.test(pid)) return;
  let p = s.players.find(x => x.id === pid);
  if (m.t === 'hello') {
    if (!p) {
      if (s.phase !== 'lobby') { hostSendTo(pid, { t: 'reject', why: 'started' }); return; }
      if (s.players.length >= MAX_PLAYERS) { hostSendTo(pid, { t: 'reject', why: 'full' }); return; }
      p = mkPlayer(s, pid, cleanName(m.name) || '손님', false); s.players.push(p);
    } else if (s.phase === 'lobby' && cleanName(m.name)) p.name = cleanName(m.name);
    H.last.set(pid, Date.now()); p.online = true;
    hostBroadcast();
    return;
  }
  if (!p) return;
  H.last.set(pid, Date.now());
  if (!p.online) { p.online = true; if (m.t === 'ping') { hostBroadcast(); return; } }
  if (m.t === 'ping') return;
  hostAction(pid, m);
}
function hostTick() {
  if (role !== 'host' || !H.S || !H.everOpen) return;
  const now = Date.now();
  H.S.players.forEach(p => {
    if (p.ai || p.id === 'host') return;
    p.online = now - (H.last.get(p.id) || 0) < 13000;
  });
  hostBroadcast(); // 상태를 주기적으로 다시 보내서 놓친 메시지를 메움
}

/* =========================================================
   참가자 (게스트)
   ========================================================= */
const G = { bus: null, code: null, lastHeard: 0, hb: null, joined: false, sawHost: false, okSince: 0, hid: null, rev: -1 };

function guestJoin(code) {
  role = 'guest'; Object.assign(G, { code, joined: false, sawHost: false, okSince: 0, hid: null, rev: -1, lastHeard: 0 });
  renderConnecting(`방 ${code}에 들어가는 중…`, () => !G.joined);
  if (G.bus) G.bus.close();
  const bus = G.bus = new Bus(BROKERS);
  bus.sub(TOPIC + code + '/s', guestOnMsg);
  bus.onChange(ok => {
    if (role !== 'guest' || G.bus !== bus) return;
    if (ok && !G.okSince) G.okSince = Date.now();
    if (G.joined) setNet(ok ? 'ok' : 'reconnecting');
    if (ok) guestSend(G.joined ? { t: 'ping' } : { t: 'hello', name: me.name });
  });
  clearInterval(G.hb);
  G.hb = setInterval(() => {
    if (role !== 'guest' || G.bus !== bus) return;
    if (bus.ok) guestSend(G.joined ? { t: 'ping' } : { t: 'hello', name: me.name });
    if (G.joined) { if (Date.now() - G.lastHeard > 10000) setNet('reconnecting'); }
    else if (G.okSince && !G.sawHost && Date.now() - G.okSince > 15000) {
      guestStop(); renderHome(`방 ${code}을(를) 찾을 수 없어요. 코드를 확인하거나, 호스트 화면에 대기실이 보이는지 확인해 주세요.`);
    }
  }, 3000);
}
function guestSend(m) { m.pid = me.pid; return !!(G.bus && G.bus.pub(TOPIC + G.code + '/c', m)); }
function guestOnMsg(m) {
  if (role !== 'guest') return;
  if (m.to && m.to !== me.pid) return;
  if (m.t === 'state' && m.s && Array.isArray(m.s.players)) {
    G.sawHost = true;
    if (m.hid !== G.hid) { G.hid = m.hid; G.rev = -1; }
    const rev = +m.s.rev || 0;
    if (rev <= G.rev) return; // 늦게 도착한 옛 상태는 무시
    G.rev = rev; G.lastHeard = Date.now();
    if (!G.joined) {
      if (!m.s.players.some(p => p.id === me.pid)) return; // 아직 명단에 없음 → 계속 인사
      G.joined = true; LS.set('kb-guest', { code: G.code, ts: Date.now() });
    }
    if (netState !== 'ok') setNet('ok');
    onState(m.s);
  } else if (m.t === 'reject' && m.to === me.pid) {
    guestStop(); LS.del('kb-guest');
    renderHome(m.why === 'full' ? '방이 가득 찼어요. (최대 4명)' : '이미 게임이 시작된 방이에요. 다음 판에 들어와 주세요.');
  } else if (m.t === 'kicked' && m.to === me.pid) {
    guestStop(); LS.del('kb-guest'); renderHome('호스트가 방에서 내보냈어요.');
  } else if (m.t === 'closed' && G.joined) {
    guestStop(); LS.del('kb-guest'); renderHome('호스트가 방을 닫았어요.');
  }
}
function guestStop() {
  clearInterval(G.hb);
  if (G.bus) G.bus.close();
  G.bus = null; role = null; S = null; mountKey = null;
}
async function guestLeave() {
  if (!(await ask('방에서 나갈까요?', '나가기'))) return;
  guestSend({ t: 'leave' });
  LS.del('kb-guest');
  setTimeout(() => { guestStop(); renderHome(); }, 300);
}

let connTimer = null;
function renderConnecting(text, stillWaiting) {

    <div class="spin">${dkHTML(0)}</div><p style="font-size:18px" id="cmsg">${esc(text)}</p>

// 글자 폭 단위: 한글·한자 1, 영문·숫자 약 0.58
function textUnits(v) { let u = 0; for (const ch of String(v)) u += /[\u1100-\u11ff\u2e80-\ua4cf\uac00-\ud7af\uf900-\ufaff\uff00-\uffef]/.test(ch) ? 1 : /[A-Zmw@%#]/.test(ch) ? .72 : .58; return Math.max(u, .58); }
function fitF(v, max, room) { // room: 칸 너비 대비 쓸 수 있는 비율
  const u = textUnits(v);
  if (u <= 2.4) return Math.min(max, room / u);
  return Math.max(.14, Math.min(max * .72, room / Math.ceil(u / 2) * .92)); // 두 줄로
}
const cellF = v => fitF(v, .5, .86);
function renderBoards(newKey) {

    const li = lineInfo(p.board, calledSet, s.N);

    const hidden = s.view === 'mine' && s.phase === 'play' && p.id !== myId(); // 내 판만 보기: 게임 중엔 남의 판을 가림, 끝나면 공개
    const cells = hidden ? Array.from({ length: s.N * s.N }, () => '<div class="c hid"></div>').join('') : (p.board || Array(s.N * s.N).fill('')).map((v, i) => {
      const k = norm(v), on = k && calledSet.has(k);
      const extra = pk && !on ? ` pk${pickSel === i ? ' sel' : ''}" data-i="${i}` : '';
      return `<div class="c${on ? ' on' : ''}${li.mask.has(i) ? ' ln' : ''}${on && newKey && k === newKey ? ' new' : ''}${extra}" style="--f:${cellF(v, s.N)}">${esc(v)}</div>`;
    }).join('');
    const isTurn = s.phase === 'play' && cur && cur.id === p.id;
    return `<div class="panel${p.id === myId() ? ' me' : ''}${isTurn ? ' turn' : ''}${pk ? ' picking' : ''}" style="--pc:${COLORS[p.color]}">
      <div class="ph">${dkHTML(p.color)}<span class="pn">${esc(p.name)}</span>${p.id === myId() ? '<span class="tg">나</span>' : ''}${p.ai ? '<span>🤖</span>' : ''}${!p.ai && !p.online ? '<span class="tg off">끊김</span>' : ''}
        <span class="ln"><b>${li.count}</b>/${s.L}줄</span></div>
      <div class="pb"><div class="grid" style="--n:${s.N}">${cells}</div>${hidden && !p.rank ? '<div class="lockov"><span>🔒 비공개</span></div>' : ''}${p.rank ? `<div class="stamp"><span>${MEDAL(p.rank)} ${p.rank}등</span></div>` : ''}</div>
    </div>`;
  }).join(''));
}
function renderBar() {

  setHTML($('#called'), s.called.length ? `<span class="lab">나온 것 ${s.called.length}</span>` + s.called.slice().reverse().map((v, i) => `<span class="chip${i ? '' : ' now'}">${esc(v)}</span>`).join('') : `<span class="lab">아직 나온 것이 없어요</span>`);

  } else if (cur && cur.id === mine.id) {
    html = `${dkHTML(cur.color)}<div class="tt">내 차례!<small>뽑기를 눌러 하나 뽑으세요</small></div>
      <button class="drawbtn" data-p="draw" ${animating || locked ? 'disabled style="opacity:.5;animation:none"' : ''}>${dkHTML(0, '--a:#fff;--b:#FFC2B8')} 뽑기!</button>`;
  } else if (cur) {

    html = `${dkHTML(cur.color)}<div class="tt">${esc(cur.name)} 차례<small>${sub}</small></div>
      ${host && !cur.ai ? `<button class="btn line sm" data-p="force">대신 ${pick ? '고르기' : '뽑기'}</button>` : ''}`;
  }
  setHTML($('#turnrow'), html || '');
  renderTimer();
  clearTimeout(barTimer);
  const until = Math.max(animating ? animUntil : 0, locked ? drawLockUntil : 0);
  if (until) barTimer = setTimeout(() => { if ($('#turnrow')) renderBar(); }, until - Date.now() + 20);
}
// 자동 진행 남은 시간 막대 (호스트가 정한 마감 시각 기준)
function renderTimer() {
  const box = $('#tbar'); if (!box) return;
  const s = S, cur = s.players[s.turn];
  const show = s.phase === 'play' && s.auto && s.deadline && cur;
  const key = show ? s.deadline + ':' + s.turn : '';
  if (box._k === key) return;
  box._k = key; clearInterval(tbarTick);
  if (!show) { box.innerHTML = ''; box.style.display = 'none'; return; }
  box.style.display = '';
  const total = s.iv * 1000 + (s.called.length ? 0 : 1500);
  const end = s.deadline + clockOff;
  const left = clamp(end - Date.now(), 0, total);
  const pc = 8 + left / total * 84;
  const word = cur.id === myId() ? '내 차례' : cur.name;
  box.innerHTML = gbarHTML(pc, Math.ceil(left / 1000) + '초', COLORS[cur.color]);
  const fill = box.querySelector('.gfill'), knob = box.querySelector('.gknob'), lab = box.querySelector('.gval');
  box.title = word + ' 남은 시간';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    fill.style.transition = `width ${left}ms linear`; knob.style.transition = `left ${left}ms linear`;
    fill.style.width = '8%'; knob.style.left = '8%';
  }));
  tbarTick = setInterval(() => {
    if (!box.isConnected) { clearInterval(tbarTick); return; }

    lab.textContent = Math.ceil(l / 1000) + '초';
    box.classList.toggle('hurry', l < 2500);
    if (l <= 0) clearInterval(tbarTick);
  }, 200);
}
function playDraw(d) {

  const fs = fitF(d.value, .3, .48);

  let dust = '';
  for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2, r = 120 + rnd(60); dust += `<i class="dust" style="--dx:${Math.cos(a) * r}px;--dy:${Math.sin(a) * r * .6 + 40}px"></i>`; }
  w.className = 'dkwrap';
  void w.offsetWidth;
  w.innerHTML = `<div class="stage"><div class="ring"></div>${dust}${dkHTML(ci, `--fs:${fs}`, `<span class="dkv">${esc(d.value)}</span>`)}<div class="who">${S.mode === 'pick' ? '📣 ' : ''}${esc(by ? by.name : '')}${by && by.ai ? ' 🤖' : ''}${d.auto ? ' · 자동' : ''}</div></div>`;
  w.className = 'dkwrap show';
  animUntil = Date.now() + 1500;
  dkTimers.push(setTimeout(() => {

    document.body.classList.remove('shake'); void document.body.offsetWidth; document.body.classList.add('shake');
  }, 300));

  dkTimers.push(setTimeout(() => { w.className = 'dkwrap out'; }, 1500));
  dkTimers.push(setTimeout(() => { w.className = 'dkwrap'; w.innerHTML = ''; }, 1950));
}
function updPlay(prev) {
